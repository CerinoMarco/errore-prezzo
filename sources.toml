# =====================================================================
# sources.toml - configurazione del monitor errori di prezzo
# =====================================================================
# Modifichi SOLO questo file. Il motore (price_alert.py) non si tocca.
#
# REGOLA (semplice): un alert scatta se il calo e' >= 50 EUR  E  >= 40%.
# Vale per QUALUNQUE categoria: e' il filtro a fare il lavoro.
#   min_abs_saving  -> quanti EUR minimo di sconto
#   anomaly_drop    -> quale percentuale minima  (0.40 = -40%)
# Troppi alert? anomaly_drop a 0.50.  Troppo pochi? a 0.30.
#
# IMPORTANTE (rate-limit): Shopify limita quante richieste /products.json
# accetta da uno stesso IP in poco tempo. Il monitor va SEQUENZIALE (un
# negozio per volta, con pausa). Tieni pochi negozi accesi: se ne accendi
# troppi, riappaiono i 429. Meglio 5 puliti che 15 che si bloccano.

[settings]
poll_seconds      = 90     # ripassa le fonti ogni 90s
anomaly_drop      = 0.40   # <-- IL TUO NUMERO %  (0.40 = -40%)
min_abs_saving    = 20.0   # <-- IL TUO NUMERO EUR (almeno 20 EUR di sconto)
alto_rischio_drop = 0.80   # oltre questo calo l'errore e' spesso annullabile (flag ALTO)
ema_alpha         = 0.30   # reattivita' della baseline (media mobile)
trust_after       = 3      # letture normali prima di fidarsi della baseline (cold-start)
heartbeat_hours   = [15]    # ping "tutto ok" su Telegram a queste ore locali (oltre all'avvio); [] per spegnerlo

